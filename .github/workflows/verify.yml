name: Verify foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust-and-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --offline
      - run: python3 -m pip install cryptography
      - run: python3 -m unittest discover -s labs/linux-python -v
      - run: |
          mkdir -p research/upstream
          tar -xzf research/s3backer-source.tar.gz -C research/upstream
          tar -xzf research/Infiniswap-source.tar.gz -C research/upstream
          python3 scripts/verify-sources.py
  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/macos
      - run: bash scripts/build-mac.sh
      - run: dist/CLOUDSWAP.app/Contents/Helpers/cloudswap-lab
      - run: dist/CLOUDSWAP.app/Contents/Helpers/R2Lab --self-test
      - name: FUSE callbacks and native helper faults (no mount)
        run: |
          export CLOUDSWAP_FILE_HELPER="$PWD/dist/CLOUDSWAP.app/Contents/Helpers/R2Lab"
          python3 -m unittest discover -s labs/macos-fuse -v
          python3 labs/macos-fuse/cloudswap_fuse.py --self-test --helper "$CLOUDSWAP_FILE_HELPER"
