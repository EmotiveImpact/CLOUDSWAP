name: Verify disaggregation research
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'research/disaggregation/**'
      - 'scripts/verify-disaggregation.py'
      - 'scripts/tests/test_disaggregation.py'
      - '.github/workflows/disaggregation-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/verify-disaggregation.py
      - run: python3 -m unittest discover -s scripts/tests -v
